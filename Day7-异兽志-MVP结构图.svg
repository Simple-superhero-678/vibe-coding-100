<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 884" width="680" height="884" role="img">
<title>异兽志 MVP 结构图（Day 7）</title>
<desc>三层结构。启动链：index.html 以 type=module 载入 js/main.js（装配层）。main.js 调用三个模块：js/data.js 负责加载与校验条目、js/search.js 负责 2-gram 倒排索引、js/views/grid.js 负责渲染卡片与图源判定。data.js 读 data/yishou.json；grid.js 取 assets 下的图片，私有图在 assets-private。未建部分为 store.js 收藏、transit.js 转场、renderDetail 详情与其余四个视图。页面区块：shell 内含 header.hero（题识、定位语、竖排题签）、div.tail 版心鱼尾、div.scroll 卷轴（含 finder 搜索与五部 tab、filter 吉凶筛选条、grid 图鉴网格）、footer.colophon 书尾；另有 div.margins 装饰层，不承载信息。</desc>
<style>
text{font-family:var(--font-sans,system-ui,"Microsoft YaHei",sans-serif)}
.tt{font-size:13px;font-weight:500;fill:#1F1B18}
.tb{font-size:13px;fill:#1F1B18}
.ts{font-size:12px;fill:#6B6157}
.tc{font-size:11px;fill:#6B6157}
.ac{font-size:12px;font-weight:500;fill:#A3302A}
</style>

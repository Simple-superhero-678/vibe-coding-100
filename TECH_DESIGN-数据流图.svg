<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 656" width="1180" height="656" font-family="'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif">
  <title>异兽志 · 数据流图</title>
  <desc>内容流：ima 知识库摘要经人工提炼录入 data/*.json，提交后由 GitHub Pages 发布。用户流：浏览器 fetch 读取 JSON，校验建索引后渲染四个视图，用户操作触发收藏写入 localStorage，刷新后读回渲染，可导出 txt 或剪贴板。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B6157" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="656" fill="#FDFCF9"/>

  <text x="40" y="52" font-size="22" font-weight="500" fill="#1F1B18">异兽志 · 数据流图</text>
  <text x="40" y="82" font-size="14" fill="#6B6157">两条流：内容流（人做，慢）与用户流（机器做，快）</text>

  <rect x="40" y="110" width="1100" height="178" rx="16" fill="#F7F3EA" stroke="#1F1B18" stroke-opacity="0.12" stroke-width="1"/>
  <text x="64" y="142" font-size="13" font-weight="500" fill="#A3302A">① 内容流 · 数据从哪来</text>
  <text x="1116" y="142" font-size="12" fill="#6B6157" text-anchor="end">人做，一批一次</text>

  <rect x="72" y="176" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="158" y="209" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">ima 知识库</text>
  <text x="158" y="233" font-size="12" fill="#6B6157" text-anchor="middle">传统文化 6 篇摘要</text>

  <rect x="288" y="176" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="374" y="209" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">人工提炼录入</text>
  <text x="374" y="233" font-size="12" fill="#6B6157" text-anchor="middle">读素材，写条目</text>

  <rect x="504" y="176" width="172" height="80" rx="10" fill="#FDF3F2" stroke="#A3302A" stroke-width="1.5"/>
  <text x="590" y="209" font-size="14" font-weight="500" fill="#A3302A" text-anchor="middle">data/*.json</text>
  <text x="590" y="233" font-size="12" fill="#6B6157" text-anchor="middle">唯一真源</text>

  <rect x="720" y="176" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="806" y="209" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">git 提交推送</text>
  <text x="806" y="233" font-size="12" fill="#6B6157" text-anchor="middle">每次一版记录</text>

  <rect x="936" y="176" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="1022" y="209" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">GitHub Pages</text>
  <text x="1022" y="233" font-size="12" fill="#6B6157" text-anchor="middle">只发文件，不跑逻辑</text>

  <line x1="244" y1="216" x2="284" y2="216" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="460" y1="216" x2="500" y2="216" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="676" y1="216" x2="716" y2="216" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="892" y1="216" x2="932" y2="216" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="316" width="1100" height="300" rx="16" fill="#F7F3EA" stroke="#1F1B18" stroke-opacity="0.12" stroke-width="1"/>
  <text x="64" y="348" font-size="13" font-weight="500" fill="#A3302A">② 用户流 · 数据到哪去</text>
  <text x="1116" y="348" font-size="12" fill="#6B6157" text-anchor="end">机器做，每次点击 · 全程不出浏览器</text>

  <rect x="72" y="382" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="158" y="415" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">浏览器 fetch</text>
  <text x="158" y="439" font-size="12" fill="#6B6157" text-anchor="middle">读 data/*.json</text>

  <rect x="288" y="382" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="374" y="415" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">校验 + 建索引</text>
  <text x="374" y="439" font-size="12" fill="#6B6157" text-anchor="middle">缺必填的不进列表</text>

  <rect x="504" y="382" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="590" y="415" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">渲染四个视图</text>
  <text x="590" y="439" font-size="12" fill="#6B6157" text-anchor="middle">首屏 · 部内 · 详情 · 收藏</text>

  <rect x="720" y="382" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="806" y="415" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">用户操作</text>
  <text x="806" y="439" font-size="12" fill="#6B6157" text-anchor="middle">搜索 · 切部 · 点卡片</text>

  <rect x="936" y="382" width="172" height="80" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="1022" y="415" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">localStorage</text>
  <text x="1022" y="439" font-size="12" fill="#6B6157" text-anchor="middle">收藏只在本机浏览器</text>

  <rect x="720" y="512" width="172" height="64" rx="10" fill="#FFFFFF" stroke="#1F1B18" stroke-opacity="0.18" stroke-width="1"/>
  <text x="806" y="537" font-size="14" font-weight="500" fill="#1F1B18" text-anchor="middle">导出 .txt / 剪贴板</text>
  <text x="806" y="559" font-size="12" fill="#6B6157" text-anchor="middle">含原文与出处</text>

  <line x1="244" y1="422" x2="284" y2="422" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="460" y1="422" x2="500" y2="422" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="676" y1="422" x2="716" y2="422" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="892" y1="422" x2="932" y2="422" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="806" y1="462" x2="806" y2="508" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M1022 256 V302 H158 V376" fill="none" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="295" font-size="12" fill="#6B6157" text-anchor="middle">用户打开页面时读一次</text>

  <path d="M1022 462 V604 H590 V468" fill="none" stroke="#6B6157" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="806" y="592" font-size="12" fill="#6B6157" text-anchor="middle">刷新后读回，收藏还在</text>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Coding 打卡学习</title>
<style>
  :root {
    --ink: #2C2C2A;
    --sub: #5F5E5A;
    --bg: #FAEEDA;
    --card: #FFFFFF;
    --tag-bg: #FAC775;
    --tag-ink: #633806;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  main {
    background: var(--card);
    padding: 48px 40px;
    border-radius: 16px;
    max-width: 560px;
    margin: 24px;
    text-align: center;
  }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 14px; }
  p { color: var(--sub); font-size: 15px; line-height: 1.7; margin: 8px 0; }
  .tag {
    display: inline-block;
    margin-top: 22px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--tag-ink);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <h1>Vibe Coding 打卡学习</h1>
  <p>这里是我的练习项目主页，目前还是一张占位页。</p>
  <p>网站功能会从 Day 7 开始搭建。</p>
  <span class="tag">Day 2 · 首次提交</span>
</main>
</body>
</html>
